name: Release to Maven Central

# Publishes when a GitHub release is published (tag format: v0.1.0).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME  - Central Portal token username (central.sonatype.com -> Account)
#   MAVEN_CENTRAL_PASSWORD  - Central Portal token password
#   SIGNING_KEY             - ASCII-armored GPG private key (gpg --armor --export-secret-keys KEYID)
#   SIGNING_PASSWORD        - passphrase for that key
#
# The com.llmjury namespace must be verified on the Central Portal first (DNS TXT record
# on llmjury.com).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches project version
        run: |
          PROJ_VERSION=$(./gradlew -q properties | awk '/^version:/ {print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PROJ_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $PROJ_VERSION" >&2
            exit 1
          fi
      - name: Build + test
        run: ./gradlew build
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
